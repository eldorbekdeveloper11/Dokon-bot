name: Reklamalarni guruhlarga yuborish

on:
  schedule:
    schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-state

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install python-telegram-bot

      - run: python send_link.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Saqlash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add groups.json ads.json
          git diff --staged --quiet || git commit -m "Reklama holati yangilandi"
          git pull --rebase
          git push
